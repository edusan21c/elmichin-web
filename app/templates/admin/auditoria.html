{% extends 'base.html' %}
{% block titulo %}Auditoría{% endblock %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">
        <i class="bi bi-shield-check"></i> Auditoría
    </h1>
    <button type="button" class="btn btn-outline-primary btn-sm" onclick="cargarDatos()">
        <i class="bi bi-arrow-clockwise"></i> Actualizar
    </button>
</div>

<!-- Filtros -->
<div class="card mb-3">
    <div class="card-body py-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label small mb-0">Desde</label>
                <input type="date" id="filtro-desde" class="form-control form-control-sm">
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-0">Hasta</label>
                <input type="date" id="filtro-hasta" class="form-control form-control-sm">
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-0">Usuario</label>
                <input type="text" id="filtro-username" class="form-control form-control-sm"
                       placeholder="ej: programador">
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-0">Acción</label>
                <select id="filtro-accion" class="form-select form-select-sm">
                    <option value="">Todas</option>
                </select>
            </div>
            {% if current_user.es_programador() and tiendas %}
            <div class="col-md-2">
                <label class="form-label small mb-0">Tienda</label>
                <select id="filtro-tienda" class="form-select form-select-sm">
                    <option value="">Todas</option>
                    {% for t in tiendas %}
                    <option value="{{ t.id }}">{{ t.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <div class="col-md-2">
                <button type="button" id="btn-aplicar" class="btn btn-primary btn-sm w-100">
                    <i class="bi bi-search"></i> Filtrar
                </button>
            </div>
        </div>
        <div class="mt-2">
            <button type="button" class="btn btn-sm btn-outline-secondary btn-preset" data-dias="0">Hoy</button>
            <button type="button" class="btn btn-sm btn-outline-secondary btn-preset" data-dias="1">Ayer</button>
            <button type="button" class="btn btn-sm btn-outline-secondary btn-preset" data-dias="7">Últimos 7 días</button>
            <button type="button" class="btn btn-sm btn-outline-secondary btn-preset" data-dias="30">Últimos 30 días</button>
        </div>
    </div>
</div>

<!-- Total -->
<div class="mb-3">
    <span class="text-muted">Mostrando <strong id="total">0</strong> registros</span>
</div>

<!-- Tabla -->
<div class="card">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th style="width: 150px;">Fecha</th>
                    <th style="width: 140px;">Usuario</th>
                    <th style="width: 150px;">Acción</th>
                    <th>Detalle</th>
                    <th style="width: 130px;">IP</th>
                </tr>
            </thead>
            <tbody id="tbl-logs">
                <tr><td colspan="5" class="text-center text-muted py-4">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
(function() {
    'use strict';

    const TIENDA_ACTUAL = {{ current_user.tienda_id or 0 }};

    function colorAccion(accion) {
        if (accion === 'login') return 'bg-success';
        if (accion === 'logout') return 'bg-secondary';
        if (accion === 'login_fallido') return 'bg-danger';
        if (accion === 'factura_crear') return 'bg-primary';
        if (accion === 'abono_registrar') return 'bg-warning text-dark';
        return 'bg-info text-dark';
    }

    function iconoAccion(accion) {
        if (accion === 'login') return '🔓';
        if (accion === 'logout') return '🔒';
        if (accion === 'login_fallido') return '⚠️';
        if (accion === 'factura_crear') return '🧾';
        if (accion === 'abono_registrar') return '💰';
        return '📌';
    }

    function cargarDatos() {
        const desde = document.getElementById('filtro-desde').value;
        const hasta = document.getElementById('filtro-hasta').value;
        const username = document.getElementById('filtro-username').value;
        const accion = document.getElementById('filtro-accion').value;
        const tiendaEl = document.getElementById('filtro-tienda');
        const tienda = tiendaEl ? tiendaEl.value : '';

        const params = new URLSearchParams({ desde, hasta, username, accion });
        if (tienda) params.append('tienda', tienda);

        fetch('/admin/api/auditoria?' + params.toString())
            .then(r => r.json())
            .then(data => {
                if (!data.ok) {
                    alert('Error: ' + (data.error || 'desconocido'));
                    return;
                }
                renderLogs(data.logs);
                renderAcciones(data.acciones);
                document.getElementById('total').textContent = data.total;
            })
            .catch(e => alert('Error de red: ' + e.message));
    }

    function renderLogs(logs) {
        const tbody = document.getElementById('tbl-logs');
        if (!logs.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Sin registros en este período</td></tr>';
            return;
        }
        tbody.innerHTML = logs.map(l => {
            const bg = colorAccion(l.accion);
            const ico = iconoAccion(l.accion);
            const nombre = l.user_nombre ? `${l.user_nombre} (${l.username})` : l.username;
            return `<tr>
                <td class="small text-muted">${l.fecha}</td>
                <td class="small fw-semibold">${nombre}</td>
                <td><span class="badge ${bg}">${ico} ${l.accion}</span></td>
                <td class="small">${l.detalle || '<span class="text-muted">—</span>'}</td>
                <td class="small text-muted">${l.ip || '—'}</td>
            </tr>`;
        }).join('');
    }

    function renderAcciones(acciones) {
        const sel = document.getElementById('filtro-accion');
        const actual = sel.value;
        sel.innerHTML = '<option value="">Todas</option>' +
            acciones.map(a => `<option value="${a}">${a}</option>`).join('');
        sel.value = actual;
    }

    // Presets de fecha
    document.querySelectorAll('.btn-preset').forEach(btn => {
        btn.addEventListener('click', function() {
            const dias = parseInt(this.dataset.dias);
            const hoy = new Date();
            const desde = new Date();
            desde.setDate(hoy.getDate() - dias);

            document.getElementById('filtro-desde').value = desde.toISOString().slice(0, 10);
            document.getElementById('filtro-hasta').value = hoy.toISOString().slice(0, 10);
            cargarDatos();
        });
    });

    document.getElementById('btn-aplicar').addEventListener('click', cargarDatos);

    // Init: hoy por defecto
    const hoy = new Date().toISOString().slice(0, 10);
    document.getElementById('filtro-desde').value = hoy;
    document.getElementById('filtro-hasta').value = hoy;

    cargarDatos();
})();
</script>
{% endblock %}
